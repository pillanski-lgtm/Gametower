name: Android-APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: bash scripts/android-setup.sh
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk hanse-haendler-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: hanse-haendler-debug-apk, path: hanse-haendler-debug.apk }
      - name: Release mit APK-Download
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" hanse-haendler-debug.apk --target "${{ github.sha }}" --prerelease \
            --title "Hanse-Händler Debug-APK ($TAG)" --notes "Debug-APK zum Testen. Installation: Datei auf dem Handy öffnen und „Unbekannte Quellen“ erlauben."
