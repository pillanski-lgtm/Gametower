<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hanse-Händler &amp; Seefahrer</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div class="stage" id="stage">
  <canvas id="view" class="scene" width="344" height="192"></canvas>
  <div id="hots"></div>
  <div class="panel" id="panel"></div>

  <div class="top">
    <div class="plate l"><span id="dateTxt"></span> · <span id="seasonTxt"></span></div>
    <div class="plate c"><span><i class="ic" data-i="coin" data-s="3"></i><b id="goldTxt"></b></span><span><i class="ic" data-i="bag" data-s="3"></i><b id="kontorTxt"></b></span></div>
    <div class="plate r" id="cityTxt"></div>
  </div>
  <canvas id="shield" class="shield" width="24" height="28"></canvas>
  <div class="speed"><button class="sp sp-p" data-act="speed" data-v="0">❚❚</button><button class="sp sp-g" data-act="speed" data-v="1">▶</button><button class="sp sp-g" data-act="speed" data-v="2">▶▶</button><button class="sp sp-b" data-act="speed" data-v="3">▶▶▶</button></div>

  <div class="bl">
    <div class="stats">
      <div><i class="ic" data-i="bag" data-s="3"></i><span class="bar4"><s id="st1" class="g"></s></span><em>Kontor</em></div>
      <div><i class="ic" data-i="hammer" data-s="3"></i><span class="bar4"><s id="st2" class="y"></s></span><em>Betriebe</em></div>
      <div><i class="ic" data-i="coin" data-s="3"></i><span class="bar4"><s id="st3" class="r"></s></span><em>Löhne</em></div>
    </div>
  </div>
  <div class="barwood"></div>
  <div class="nav oct-wrap">
    <label class="oct" data-act="go" data-p="stadt"><i class="ic" data-i="house" data-s="5"></i><em>Stadt</em></label>
    <label class="oct" data-act="go" data-p="markt"><i class="ic" data-i="coin" data-s="5"></i><em>Markt</em></label>
    <label class="oct" data-act="go" data-p="kontor"><i class="ic" data-i="bag" data-s="5"></i><em>Kontor</em></label>
    <label class="oct" data-act="go" data-p="gut"><i class="ic" data-i="hammer" data-s="5"></i><em>Betriebe</em></label>
    <label class="oct" data-act="go" data-p="bilanz"><i class="ic" data-i="scroll" data-s="5"></i><em>Bilanz</em></label>
  </div>
  <div id="toasts"></div>
  <div id="menu" class="menu"></div>
</div>
<script src="src/data.js"></script>
<script src="src/gfx.js"></script>
<script src="src/sim.js"></script>
<script src="src/scenes.js"></script>
<script src="src/game.js"></script>
</body></html>
